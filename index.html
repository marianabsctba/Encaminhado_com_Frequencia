// ---------- longe ----------
for (let i = 0; i < 240; i++) {
  const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 300;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (x > 20 && Math.abs(z - estrada(x)) < 9) continue;
  const tree = arvore(x, z, [VERDE, VERDE2, 0x5d8f2a, IPE_AMARELO][i % 13 === 0 ? 3 : i % 3], 1 + Math.random() * 0.8, altura(x, z) - 0.2);
  if (r > 200) tree.traverse(o => o.castShadow = false);
}
const nuvens = [];
for (let i = 0; i < 14; i++) {
  const g = new THREE.Group(); g.position.set((Math.random() - 0.5) * 900, 90 + Math.random() * 60, (Math.random() - 0.5) * 900);
  for (let k = 0; k < 5; k++) {
    const c = new THREE.Mesh(copaGeo, mat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.2 }));

// ---------- gente ----------

const cabeloGeo = new THREE.SphereGeometry(0.27, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);

  gente.push({ g, r: 10.5 + Math.random() * 3.5, a: Math.random() * 6.28, v: (Math.random() < 0.5 ? -1 : 1) * (0.04 + Math.random() * 0.06), f: Math.random() * 10 });

// ---------- pos-processamento: nanquim + reticula ----------
const tam = new THREE.Vector2(); renderer.getDrawingBufferSize(tam);
const rtCor = new THREE.WebGLRenderTarget(tam.x, tam.y, { type: THREE.HalfFloatType, samples: 4 });
const rtNor = new THREE.WebGLRenderTarget(tam.x, tam.y, { depthTexture: new THREE.DepthTexture(tam.x, tam.y) });
const normMat = new THREE.MeshNormalMaterial();
const post = new THREE.ShaderMaterial({
  uniforms: {
    tCor: { value: rtCor.texture }, tNor: { value: rtNor.texture }, tDep: { value: rtNor.depthTexture },
    res: { value: tam.clone() }, near: { value: camera.near }, far: { value: camera.far },
    bw: { value: 1 }, esp: { value: renderer.getPixelRatio() },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tCor; uniform sampler2D tNor; uniform sampler2D tDep;
    uniform vec2 res; uniform float near; uniform float far; uniform float bw; uniform float esp;
    varying vec2 vUv;
    float lz(vec2 uv){ float z = texture2D(tDep, uv).x * 2.0 - 1.0; return (2.0 * near * far) / (far + near - z * (far - near)); }
    void main(){
      vec2 px = esp / res;
      vec3 c = texture2D(tCor, vUv).rgb;
      float d0 = lz(vUv);
      vec3 n0 = texture2D(tNor, vUv).rgb;
      float e = 0.0;
      vec2 o[4]; o[0] = vec2(px.x, 0.0); o[1] = vec2(-px.x, 0.0); o[2] = vec2(0.0, px.y); o[3] = vec2(0.0, -px.y);
      for (int i = 0; i < 4; i++) {
        vec2 uv = vUv + o[i];
        float d = lz(uv);
        e = max(e, smoothstep(0.03, 0.07, abs(d - d0) / min(d, d0)));
        e = max(e, smoothstep(0.25, 0.45, distance(texture2D(tNor, uv).rgb, n0)));
      }
      e *= 1.0 - smoothstep(160.0, 520.0, d0);
      c = toneMapping(c);
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      float rosa = smoothstep(0.08, 0.2, c.r - c.g) * smoothstep(-0.02, 0.06, c.b - c.g);
      vec3 cinza = vec3(min(1.0, floor(pow(lum, 0.4) * 3.0 + 0.6) / 3.0 + 0.08));
      c = mix(c, mix(cinza, c, rosa), bw);
      float obj = 1.0 - step(far * 0.98, d0);
      vec2 g = mod(gl_FragCoord.xy, 5.0 * esp) - 2.5 * esp;
      float raio = (1.0 - smoothstep(0.04, 0.22, lum)) * 2.0 * esp;
      float ponto = (1.0 - step(raio, length(g))) * obj;
      c = mix(c, c * 0.3, ponto);
      c = mix(c, vec3(1.0, 0.975, 0.94), 0.05);
      c = mix(c, vec3(0.07, 0.05, 0.09), e);
      gl_FragColor = linearToOutputTexel(vec4(c, 1.0));
    }`,
});
const postCena = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post); quad.frustumCulled = false; postCena.add(quad);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

document.querySelectorAll('#modo button').forEach(b => b.onclick = (ev) => {

});
addEventListener('resize', () => {

  renderer.getDrawingBufferSize(tam); rtCor.setSize(tam.x, tam.y); rtNor.setSize(tam.x, tam.y);
  post.uniforms.res.value.copy(tam);
});

const TOM = '<defs><pattern id="tom" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#c9c4d6"/></pattern></defs>';
const RETRATOS = {

// ---------- contagio ----------
let maquinas = 0, mostrado = 0;
const fila = [], aneis = [];
let relogio = 0;
const anelGeo = new THREE.RingGeometry(0.85, 1, 64); anelGeo.rotateX(-Math.PI / 2);
function anel(pos) {
  const m = new THREE.Mesh(anelGeo, new THREE.MeshBasicMaterial({ color: 0xff4f9a, transparent: true, opacity: 0.9, depthWrite: false }));
  m.position.set(pos.x, 0.6, pos.z); scene.add(m); aneis.push({ m, t: 0 });
}
function infectar(c) {
  if (!c || c.inf) return;
  c.inf = true; c.parede.material = rosaMat; c.pulso = 1; maquinas += c.maq;
}
function onda(origem, n, passo = 0.16, exceto = [INFO]) {
  anel(origem.g.position);
  const livres = casas.filter(c => !c.inf && !exceto.includes(c) && !fila.some(f => f.c === c))
    .sort((a, b) => a.g.position.distanceTo(origem.g.position) - b.g.position.distanceTo(origem.g.position))
    .slice(0, n);
  livres.forEach((c, i) => fila.push({ c, t: relogio + 0.5 + i * passo }));
}
function resetar() {
  for (const c of casas) { c.inf = false; c.pulso = 0; c.g.scale.setScalar(1); }
  for (const c of casas) c.parede.material = c.paredeOriginal;
  fila.length = 0; maquinas = 0; mostrado = 0;
}
casas.forEach(c => c.paredeOriginal = c.parede.material);

// ---------- camera ----------
let voo = null;
function visao(c, dist = 17, alt = 5.5, lado = 0) {
  const p = c.g.position, d = new THREE.Vector3(-p.x, 0, -p.z).normalize(), l = new THREE.Vector3(-d.z, 0, d.x);
  return [p.clone().addScaledVector(d, dist).addScaledVector(l, lado).add(new THREE.Vector3(0, alt, 0)), new THREE.Vector3(p.x, 2.4, p.z)];
}
function voar(alvo, dur = 2.2) { voo = { p0: camera.position.clone(), a0: controls.target.clone(), p1: alvo[0], a1: alvo[1], t: 0, dur }; }
const suave = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

// ---------- roteiro ----------
const $ = s => document.querySelector(s);
const legenda = $('#legenda'), fala = $('#fala'), dica = $('#dica'), contador = $('#contador');
const PASSOS = [
  { cam: visao(LAN), legenda: 'Santa Rita do Oeste. Terça-feira, 14h12.<br>Alguém esqueceu um pendrive na LAN House.' },
  { legenda: 'O Thalisson achou. Plugou pra ver o que tinha.<br><b>Pronto. Você existe.</b>', acao: () => { infectar(LAN); anel(LAN.g.position); contador.style.display = 'block'; } },
  { legenda: 'Dentro do pendrive tinha um "vídeo". O Thalisson mandou pra avó, a Dona Rosimeire.', acao: () => onda(LAN, 3) },
  { cam: visao(TIA), fala: ['tia', 'Dona Rosimeire', 'Gente, que vídeo lindo! Encaminhem pra todo mundo!!!'], acao: () => { infectar(TIA); onda(TIA, 14, 0.12); } },
  { cam: visao(BAR), fala: ['ze', 'Seu Jurandir', 'Instalei o ZapZap Gold que a Rosi mandou. Agora tá tudo rosa...'], acao: () => { infectar(BAR); onda(BAR, 16, 0.12); } },
  { cam: [new THREE.Vector3(-10, 70, 78), new THREE.Vector3(0, 0, 2)], dur: 3,
    legenda: 'Rádio Santa Rita, 16h:<br>"Especialistas da cidade culpam a antena nova do 5G."',
    acao: () => { const resto = casas.filter(c => !c.inf && c !== INFO); const poupadas = resto.slice(0, 4); onda(LAN, 999, 0.05, [INFO, ...poupadas]); } },
  { cam: visao(INFO, 14, 4.5), fala: ['ana', 'Dandara', 'Peraí... esse pendrive veio da LAN House?!', true], acao: () => tremer() },
  { legenda: '<b>A Dandara percebeu você.</b><br>Ela é a única técnica da cidade. E agora ela está com raiva.' },
];
let passo = -1, travado = false, emCena = false;

function mostrarFala(f) {
  if (!f) { fala.style.display = 'none'; return; }
  const [ret, nome, txt, vila] = f;
  fala.querySelector('.ret').innerHTML = RETRATOS[ret];
  fala.querySelector('.nome').textContent = nome;
  fala.querySelector('.txt').textContent = txt;
  fala.classList.toggle('vila', !!vila);
  fala.style.display = 'flex';
  fala.animate([{ transform: 'translate(-50%, 30px)', opacity: 0 }, { transform: 'translate(-50%, 0)', opacity: 1 }], { duration: 280, easing: 'ease-out' });
}
function tremer() {
  renderer.domElement.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-9px,5px)' }, { transform: 'translate(7px,-6px)' }, { transform: 'translate(-4px,3px)' }, { transform: 'translate(0,0)' }], { duration: 380, iterations: 2 });
}
function avancar() {
  if (!emCena || travado) return;
  passo++;
  dica.style.display = 'none';
  if (passo >= PASSOS.length) return terminar();
  const p = PASSOS[passo];
  legenda.style.display = 'none'; mostrarFala(null);
  if (p.cam) voar(p.cam, p.dur ?? 2.2);
  travado = true;
  setTimeout(() => {
    if (p.legenda) { legenda.innerHTML = p.legenda; legenda.style.display = 'block'; }
    if (p.fala) mostrarFala(p.fala);
    p.acao?.();
    setTimeout(() => { travado = false; dica.style.display = 'block'; }, 700);
  }, p.cam ? (p.dur ?? 2.2) * 1000 * 0.85 : 150);
}
function comecar() {
  $('#capa').style.display = 'none'; $('#fim').style.display = 'none';
  resetar(); contador.style.display = 'none';
  controls.enabled = false; controls.autoRotate = false;
  emCena = true; passo = -1; travado = false;
  avancar();
}
function terminar() {
  emCena = false; legenda.style.display = 'none'; mostrarFala(null);
  const n = casas.filter(c => c.inf).length;
  $('#fimtxt').innerHTML = `Em uma tarde você chegou a <b>${maquinas}</b> máquinas em ${n} das ${casas.length} casas. Só a Dandara Tec e umas casas sem internet escaparam.<br>Agora a Dandara sabe que você existe.`;
  $('#fim').style.display = 'flex';
  voar([new THREE.Vector3(62, 40, 66), new THREE.Vector3(0, 3, 0)], 3);
}
$('#jogar').onclick = (e) => { e.stopPropagation(); comecar(); };
$('#denovo').onclick = (e) => { e.stopPropagation(); comecar(); };
$('#passear').onclick = (e) => {
  e.stopPropagation(); $('#fim').style.display = 'none';
  controls.enabled = true; controls.autoRotate = true;
};
addEventListener('pointerdown', (e) => { if (!e.target.closest?.('button')) avancar(); });
addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); avancar(); } });
controls.addEventListener('start', () => controls.autoRotate = false);

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  relogio += dt;
  for (const p of gente) {
    p.a += p.v * dt;
    p.g.position.set(Math.cos(p.a) * p.r, 0.35 + Math.abs(Math.sin(t * 7 + p.f)) * 0.07, Math.sin(p.a) * p.r);
  }
  for (const n of nuvens) { n.position.x += dt * 2.5; if (n.position.x > 500) n.position.x = -500; }
  for (let i = fila.length - 1; i >= 0; i--) if (fila[i].t <= relogio) { infectar(fila[i].c); fila.splice(i, 1); }
  for (const c of casas) if (c.pulso > 0) { c.pulso = Math.max(0, c.pulso - dt * 2.2); c.g.scale.setScalar(1 + Math.sin(c.pulso * Math.PI) * 0.12); }
  for (let i = aneis.length - 1; i >= 0; i--) {
    const a = aneis[i]; a.t += dt;
    a.m.scale.setScalar(1 + a.t * 22); a.m.material.opacity = Math.max(0, 0.9 - a.t * 0.55);
    if (a.t > 1.7) { scene.remove(a.m); a.m.material.dispose(); aneis.splice(i, 1); }
  }
  rosaMat.emissiveIntensity = 0.75 + Math.sin(t * 4) * 0.2;
  if (mostrado < maquinas) { mostrado = Math.min(maquinas, mostrado + Math.max(1, (maquinas - mostrado) * dt * 4)); $('#num').textContent = Math.floor(mostrado); }
  if (voo) {
    voo.t += dt; const k = suave(Math.min(1, voo.t / voo.dur));
    camera.position.lerpVectors(voo.p0, voo.p1, k); controls.target.lerpVectors(voo.a0, voo.a1, k);
    if (k >= 1) voo = null;
  }
  controls.update();
  scene.overrideMaterial = normMat;
  for (const a of aneis) a.m.visible = false;
  renderer.setRenderTarget(rtNor); renderer.render(scene, camera);
  scene.overrideMaterial = null;
  for (const a of aneis) a.m.visible = true;
  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(rtCor); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postCena, postCam);
});
</script>
